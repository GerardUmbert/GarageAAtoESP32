[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32c3_debug]
extends = env:esp32c3
build_flags = -DCORE_DEBUG_LEVEL=4

[env:native]
platform = native
test_build_src = false
