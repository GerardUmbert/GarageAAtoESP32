[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.2
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

[env:esp32_debug]
extends = env:esp32
build_flags = -DCORE_DEBUG_LEVEL=4

[env:native]
platform = native
test_build_src = false
