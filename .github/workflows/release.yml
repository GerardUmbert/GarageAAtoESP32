name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version_notes:
        description: "Release notes (leave blank to pull from CHANGELOG.md)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p $HOME/.keystores
          echo "$KEYSTORE_BASE64" | base64 -d > $HOME/.keystores/release.jks
          echo "KEYSTORE_PATH=$HOME/.keystores/release.jks" >> $GITHUB_ENV

      - name: Build release APK, release bundle, and debug APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease assembleDebug

      - name: Get version from build.gradle.kts
        id: version
        run: |
          echo "version=$(grep 'versionName' android/app/build.gradle.kts | grep -oP '(?<=\")[^\"]+(?=\")')" >> $GITHUB_OUTPUT

      - name: Rename build outputs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          AAB=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -1)
          cp "$RELEASE_APK" "GarageAAtoESP32-${VERSION}.apk"
          cp "$DEBUG_APK"   "GarageAAtoESP32-${VERSION}-debug.apk"
          cp "$AAB"         "GarageAAtoESP32-${VERSION}.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            GarageAAtoESP32-${{ steps.version.outputs.version }}.apk
            GarageAAtoESP32-${{ steps.version.outputs.version }}-debug.apk
            GarageAAtoESP32-${{ steps.version.outputs.version }}.aab

  release:
    runs-on: ubuntu-latest
    needs: [build-android]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.build-android.outputs.version }}
          LAST_RELEASED=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[0].tagName // ""' \
            | sed 's/^v//')
          NOTES=$(python3 .github/extract_changelog.py "$VERSION" "$LAST_RELEASED")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Package flash tool
        run: zip -r GarageAAtoESP32-flash-tool.zip firmware/flash.bat firmware/flash.ps1 firmware/flash.sh firmware/platformio.ini firmware/src firmware/include

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build-android.outputs.version) }}
          name: GarageAAtoESP32 ${{ needs.build-android.outputs.version }}
          body: |
            ${{ github.event.inputs.version_notes || steps.changelog.outputs.notes }}

            ---

            > **Firmware:** no pre-built binary is provided — the PIN must be yours.
            > Download `GarageAAtoESP32-flash-tool.zip`, extract it, and run `flash.bat` (Windows) or `flash.sh` (Linux). It installs PlatformIO if needed, lets you pick your board, and compiles and flashes with your PIN in one step.
          files: |
            artifacts/apk/*.apk
            artifacts/apk/*.aab
            GarageAAtoESP32-flash-tool.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 10)
        run: |
          releases=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName')
          for tag in $releases; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
