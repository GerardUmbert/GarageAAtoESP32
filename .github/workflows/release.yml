name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version_notes:
        description: "Release notes (leave blank to pull from CHANGELOG.md)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build-android:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/gradle/libs.versions.toml', 'android/**/*.gradle.kts') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Get version from build.gradle.kts
        id: version
        run: |
          echo "version=$(grep 'versionName' android/app/build.gradle.kts | grep -oP '(?<=\")[^\"]+(?=\")')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$APK" GarageAAtoESP32-${{ steps.version.outputs.version }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: GarageAAtoESP32-${{ steps.version.outputs.version }}.apk

  build-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        working-directory: firmware
        run: pio run -e esp32

      - name: Rename firmware binary
        run: |
          cp firmware/.pio/build/esp32/firmware.bin GarageAAtoESP32-firmware-PLACEHOLDER-PIN.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: GarageAAtoESP32-firmware-PLACEHOLDER-PIN.bin

  release:
    runs-on: ubuntu-latest
    needs: [build-android, build-firmware]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Extract changelog for this version
        id: changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.build-android.outputs.version }}
          OLDEST_KEPT=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[9:10] | .[0].tagName // ""' \
            | sed 's/^v//')
          NOTES=$(python3 .github/extract_changelog.py "$VERSION" "$OLDEST_KEPT")
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', needs.build-android.outputs.version) }}
          name: GarageAAtoESP32 ${{ needs.build-android.outputs.version }}
          body: |
            ${{ github.event.inputs.version_notes || steps.changelog.outputs.notes }}

            ---

            > **Firmware note:** The `.bin` file is built with the placeholder PIN `change-me-before-flashing`.
            > It is provided for testing only. To use it for real, flash from source with your own PIN set in `firmware/include/config.h`.
          files: |
            artifacts/apk/*.apk
            artifacts/firmware/*.bin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete old releases (keep last 10)
        run: |
          releases=$(gh release list --limit 100 --json tagName,createdAt \
            | jq -r 'sort_by(.createdAt) | reverse | .[10:] | .[].tagName')
          for tag in $releases; do
            echo "Deleting release $tag"
            gh release delete "$tag" --yes
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
